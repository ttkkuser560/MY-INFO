<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f20">
  <title>My Bio Link</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page">
    <section class="profile-card">
      <div class="avatar-wrap">
        <!-- নিজের ছবির নাম profile.jpg করে এই ফোল্ডারে রাখো -->
        <img class="avatar" src="profile.jpg" alt="Profile photo"
             onerror="this.style.display='none';document.querySelector('.avatar-fallback').style.display='grid'">
        <div class="avatar-fallback">YOUR<br>PHOTO</div>
      </div>

      <h1 id="profileName">Your Name</h1>
      <p class="role" id="profileRole">Content Creator & Designer</p>
      <p class="bio" id="profileBio">Welcome to my official social links page.</p>

      <div class="links-grid">
        <a class="link-card" href="#" data-link="youtube" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M21.6 7.2a2.8 2.8 0 0 0-2-2C17.8 4.7 12 4.7 12 4.7s-5.8 0-7.6.5a2.8 2.8 0 0 0-2 2A29 29 0 0 0 2 12a29 29 0 0 0 .4 4.8 2.8 2.8 0 0 0 2 2c1.8.5 7.6.5 7.6.5s5.8 0 7.6-.5a2.8 2.8 0 0 0 2-2A29 29 0 0 0 22 12a29 29 0 0 0-.4-4.8ZM10 15.3V8.7l5.7 3.3-5.7 3.3Z"/></svg></span><b>YOUTUBE</b>
        </a>
        <a class="link-card" href="#" data-link="facebook" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.2v2.3H7.6v3.1h2.7v8h3.2Z"/></svg></span><b>FACEBOOK</b>
        </a>
        <a class="link-card" href="#" data-link="instagram" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.7" r="1" class="fill"/></svg></span><b>INSTAGRAM</b>
        </a>
        <a class="link-card" href="#" data-link="whatsapp" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M20.5 11.7a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.4-4.9a8.4 8.4 0 1 1 16.1-3.9Z"/><path d="M8.5 8.2c.4-.7.8-.6 1.1-.6h.5c.2 0 .4.1.5.4l.8 1.9c.1.2.1.4 0 .6l-.6.8c-.2.2-.2.4 0 .7.5.8 1.2 1.5 2.1 2 .3.2.5.2.7-.1l.9-1c.2-.2.4-.2.7-.1l1.8.9c.3.1.4.3.4.5 0 .3-.2 1.2-.8 1.7-.6.6-1.4.8-2.2.7-.8-.1-1.9-.5-3.2-1.4-1.6-1.1-2.7-2.5-3-3.4-.4-.9-.4-1.8.3-2.6Z"/></svg></span><b>WHATSAPP</b>
        </a>
        <a class="link-card" href="#" data-link="telegram" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="m21 3-7.2 18-3.9-7.1L3 10.1 21 3Z"/><path d="m9.9 13.9 4.5-4.3"/></svg></span><b>TELEGRAM</b>
        </a>
        <a class="link-card" href="#" data-link="email">
          <span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></span><b>EMAIL</b>
        </a>
        <button class="link-card info-card" id="infoButton" type="button">
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7h.01"/></svg></span><b>INFORMATION</b>
        </button>
      </div>
      <footer>© <span id="year"></span> <span id="footerName">Your Name</span> · All rights reserved</footer>
    </section>
  </main>

  <div class="modal" id="infoModal" aria-hidden="true">
    <div class="modal-box">
      <button class="close" id="closeModal" aria-label="Close">×</button>
      <div class="mini-avatar">i</div>
      <h2>About Me</h2>
      <p id="modalInfo">Hello! This is my personal website. Connect with me through my social links.</p>
      <a class="contact-button" href="#" data-link="email">Contact Me</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
